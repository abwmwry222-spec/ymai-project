name: Flutter Web and Code Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0' # إصدار ثابت ومتوافق جداً مع مشروعك

    - name: Install dependencies
      run: flutter pub get

    - name: Verify Code Compilation
      run: flutter build web --release # سيقوم بالبناء بصيغة الويب السريعة للتأكد من سلامة كود المونتاج بالكامل
