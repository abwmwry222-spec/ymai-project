name: ymai_proj
description: "A professional video and photo editing application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.1.2
  file_picker: ^8.0.3
  in_app_purchase: ^3.2.0
  path_provider: ^2.1.3      # مهمة جداً لحفظ وتصدير الفيديوهات حقيقياً في جهاز المستخدم
  permission_handler: ^11.3.1 # لطلب صلاحيات الوصول للاستوديو بشكل رسمي

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
