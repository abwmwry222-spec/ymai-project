name: Auto Create Android and Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'

    - name: Clean and Create Fresh Project
      run: |
        # تنظيف أي مخلفات سابقة وإنشاء مشروع أندرويد قياسي نظيف بالكامل
        flutter clean
        flutter create --project-name=ymai_project --platforms=android .

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Production APK
      run: |
        # بناء الـ APK باستخدام وضع التوافق الأقصى لتفادي تعارض الـ Gradle
        flutter build apk --release --no-pub --target-platform android-arm64

    - name: Upload APK Output
      uses: actions/upload-artifact@v4
      with:
        name: ymai-capcut-pro-apk
        path: build/app/outputs/flutter-apk/app-release.apk
