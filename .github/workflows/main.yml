name: Ultimate Success Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Clean and Re-Generate
        run: |
          flutter config --no-analytics
          # مسح أي أثر للفشل القديم
          rm -rf android
          rm -rf ios
          # إعادة إنشاء ملفات النظام من جديد تماماً
          flutter create . --platforms android --project-name=ultra_kz_pro
          flutter pub get
          # بناء النسخة النهائية
          flutter build apk --release --no-tree-shake-icons
      
      - name: Upload K.Z Master APK
        uses: actions/upload-artifact@v4
        with:
          name: K.Z-Supreme-Final
          path: build/app/outputs/flutter-apk/app-release.apk
