name: Ultimate Fix and Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Recreate Android and Build
        run: |
          rm -rf android
          flutter create . --platforms android --project-name=ultra_kz_pro
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: KZ-Supreme-Final
          path: build/app/outputs/flutter-apk/app-release.apk
