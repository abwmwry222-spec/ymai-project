name: Absolute Fix and Target Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Hard Overwrite and Inject Code
        run: |
          # 1. تنظيف ومسح مجلد أندرويد القديم المسبب للتعارض والرفض
          rm -rf android pubspec.lock
          
          # 2. إعادة إنشاء هيكل أندرويد حديث ونظيف متوافق مع خوادم جوجل
          flutter create . --platforms android --project-name=ultra_kz_pro
          
          # 3. التأكد من تنزيل المكتبات والاعتمادية السليمة لـ Material Design
          flutter pub get
          
          # 4. بناء نسخة الـ APK الحقيقية وتجميع الأكواد من ملف main.dart مباشرة
          flutter build apk --release --no-tree-shake-icons
          
      - uses: actions/upload-artifact@v4
        with:
          name: KZ-Supreme-Real-Studio
          path: build/app/outputs/flutter-apk/app-release.apk
