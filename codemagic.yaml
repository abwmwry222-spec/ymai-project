workflows:
  android-workflow:
    name: Build YMAI APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Strict Version Injection and Build
        script: |
          # 1. تنظيف الكاش وإزالة المجلد القديم تماماً
          flutter clean
          rm -rf android
          
          # 2. إنشاء مشروع أندرويد وإجباره على استخدام توافقية إصدار مستقر (بإصدار أندرويد 14 / API 34)
          flutter create . --platforms=android --org com.yzpro.ymai
          
          # 3. حقن مباشر داخل ملف الإعدادات لتعيين المعايير المستقرة يدوياً وقبل أي معالجة
          CONFIG_FILE="android/app/build.gradle"
          if [ -f "$CONFIG_FILE" ]; then
            sed -i '' 's/compileSdk = .*/compileSdk = 34/g' "$CONFIG_FILE" || sed -i 's/compileSdk = .*/compileSdk = 34/g' "$CONFIG_FILE"
            sed -i '' 's/targetSdk = .*/targetSdk = 34/g' "$CONFIG_FILE" || sed -i 's/targetSdk = .*/targetSdk = 34/g' "$CONFIG_FILE"
            sed -i '' 's/minSdk = .*/minSdk = 21/g' "$CONFIG_FILE" || sed -i 's/minSdk = .*/minSdk = 21/g' "$CONFIG_FILE"
          fi
          
          # 4. بناء الـ APK النهائي المستقر
          flutter pub get
          flutter build apk --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
