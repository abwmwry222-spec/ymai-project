workflows:
  android-workflow:
    name: Build YMAI APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Force Stable Android and Build
        script: |
          # 1. تنظيف شامل
          flutter clean
          rm -rf android
          
          # 2. إنشاء مشروع أندرويد مستقر
          flutter create . --platforms=android
          
          # 3. تعديل ملف build.gradle لإجبار النظام على استخدام API 34 المستقر بدلاً من 36 التجريبي
          sed -i '' 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle || sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle
          sed -i '' 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle || sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle
          
          # 4. تحميل الحزم والبناء
          flutter pub get
          flutter build apk --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
