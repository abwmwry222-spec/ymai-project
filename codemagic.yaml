workflows:
  android-workflow:
    name: Build YMAI APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Hard Clean and Build APK
        script: |
          # 1. تنظيف كاش فلاتر القديم والملفات المؤقتة تماماً
          flutter clean
          
          # 2. حذف مجلد أندرويد المعطوب بأكمله
          rm -rf android
          
          # 3. إعادة توليد مجلد أندرويد نظيف ومتوافق تلقائياً داخل المشروع
          flutter create . --platforms=android
          
          # 4. تحميل الحزم الصافية المحدثة
          flutter pub get
          
          # 5. البناء النهائي والمباشر لملف الـ APK
          flutter build apk --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
