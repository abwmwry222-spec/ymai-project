workflows:
  android-workflow:
    name: Build YMAI APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Ultimate Android Repair and Build
        script: |
          # 1. تنظيف شامل وإزالة مخلفات المجلد القديم
          flutter clean
          rm -rf android
          
          # 2. إنشاء مجلد أندرويد رسمي وصافي تماماً
          flutter create . --platforms=android
          
          # 3. إجبار ملفات الإعدادات على استخدام نظام أندرويد 14 المستقر (API 34)
          # وتغيير أدوات البناء للتوافق التام مع فلاتر المستقر
          TARGET_GRADLE="android/app/build.gradle"
          if [ -f "$TARGET_GRADLE" ]; then
            sed -i '' 's/compileSdk = .*/compileSdk = 34/g' "$TARGET_GRADLE" || sed -i 's/compileSdk = .*/compileSdk = 34/g' "$TARGET_GRADLE"
            sed -i '' 's/targetSdk = .*/targetSdk = 34/g' "$TARGET_GRADLE" || sed -i 's/targetSdk = .*/targetSdk = 34/g' "$TARGET_GRADLE"
          fi
          
          # 4. تحميل الحزم وبدء التجميع الرسمي للـ APK
          flutter pub get
          flutter build apk --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
