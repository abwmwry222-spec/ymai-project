workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - magic_variables
      flutter: stable
      xcode: stable
      cocoapods: default
    triggering:
      events:
        - push
      branches:
        - main
    scripts:
      - name: Clean and Refresh Project
        script: |
          cd $CM_BUILD_DIR
          flutter clean
          flutter pub get
      - name: Build Android production APK
        script: |
          cd $CM_BUILD_DIR
          flutter build apk --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/**.apk
